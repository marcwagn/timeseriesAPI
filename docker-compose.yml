version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timeseries_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timeseries_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timeseries_backend
    environment:
      APP_NAME: TimescaleAPIProject
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: postgres
      TIMESCALE_DSN: timescaledb:5432/timeseries_db
      LOG_LEVEL: INFO
      SECRET_KEY: changeme-generate-with-openssl-rand-hex-32
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - timeseries_network

volumes:
  postgres_data:
    driver: local

networks:
  timeseries_network:
    driver: bridge
