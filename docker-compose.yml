version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_wal_size=2GB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timeseries_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 32G
    networks:
      - timeseries_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timeseries_backend
    environment:
      APP_NAME: TimescaleAPIProject
      TIMESCALE_USER: app_user
      TIMESCALE_PASSWORD: app_password
      MIGRATION_USER: postgres
      MIGRATION_PASSWORD: postgres
      TIMESCALE_DSN: timescaledb:5432/timeseries_db
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - timeseries_network

volumes:
  postgres_data:
    driver: local

networks:
  timeseries_network:
    driver: bridge
